# Sources (accessed 2026-10-22):
# https://api.iteracompute.com/v1/models (served ID, retail USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/claude-haiku-5-5/ (host capabilities and pricing)
# Effort wire path: reasoning_effort = low|medium|high|xhigh|max; reasoning.effort is also accepted.
# Host /v1/models advertises a toggle, but its generation effect is unverified on this route.
# Keep effort-only controls for this listing pending host-specific effect evidence.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.05
cache = { read = 0.005, write = 0.0625 }

[cost.text.output]
price = 0.25
