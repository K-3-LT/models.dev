# Sources (accessed 2026-10-22):
# https://api.iteracompute.com/v1/models (served ID, retail USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/kimi-k2-5/ (host capabilities and pricing)
# Toggle wire path: reasoning = true|false; reasoning.enabled = true|false is also accepted.
schema = 2
base_model = "moonshotai/kimi-k2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 16_384

[cost.text.input]
price = 0.54
cache = { read = 0.06 }

[cost.text.output]
price = 2.78
